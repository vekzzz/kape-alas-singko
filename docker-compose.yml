services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kape
    ports:
      - "5433:5432"
    volumes:
      - kape-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kape"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kape-db:
